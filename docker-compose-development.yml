version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/usr/src/app:ro
    command: uvicorn app.orm:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
    environment:
      - DATABASE_HOSTNAME=localhost
      - POSTGRES_DB=social_DB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0000
      - JWT_SECRET_KEY=environment
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRES=60

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=0000
      - POSTGRES_USER=postgres
      - POSTGRES_DB=social_DB
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:


